name: CI

# There is no remote yet. This is here so that pushing one turns the checks on
# rather than starting a conversation about them; until then `tools/ci.sh` is
# the same pipeline and `tools/install-hooks.sh` runs it before every push.

on:
  push:
    branches: [main]
    # Docs-only pushes must not spend macOS minutes (10x multiplier).
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI minutes are precious (user, 2026-11-25): at most 20% of the monthly
  # included minutes may go to this repo's macOS runs. This job runs first,
  # on ubuntu-latest (seconds, ~1 billed minute), and the macOS jobs only
  # run when it allows. tools/ci-budget-guard.py does the counting from
  # the Actions API; it fails safe (deny) on any API error, and allows
  # unconditionally for a public repo, where GitHub does not bill standard
  # runners at all. See the script header for the caveats (calendar month
  # vs billing month, this repo only).
  budget-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The guard reads this workflow's runs via the Actions API, and the
    # checkout step reads the repo. Explicit, so a restrictive repo-wide
    # default token permission cannot silently make the guard fail safe.
    permissions:
      contents: read
      actions: read
    outputs:
      allow: ${{ steps.guard.outputs.allow }}
      used_billed_minutes: ${{ steps.guard.outputs.used_billed_minutes }}
      budget_billed_minutes: ${{ steps.guard.outputs.budget_billed_minutes }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the 20% CI minutes budget
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Billing day-of-month from github.com/settings/billing (1 = the
          # calendar month). Set this to the account's real billing day.
          BILLING_DAY: "1"
        run: python3 tools/ci-budget-guard.py

  checks:
    needs: budget-guard
    if: needs.budget-guard.outputs.allow == 'true'
    # macos-26 is arm64 and generally available (it is what macos-latest points
    # at). Pinned rather than `latest` so an image roll cannot change what the
    # driver is built against without a commit. It must be macOS 26: the
    # deployment target is 26.0 and Options.swift imports FSKit, so an older
    # image cannot build the Swift tests. The app builds universal
    # (arm64 + x86_64, GAPS.md §4.2), so an arm64 runner verifies both
    # slices; no -intel label is needed.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Tools macOS does not ship
        # autotools: ntfsprogs-plus has no generated configure in its repo.
        # xcodegen: the Xcode project is generated from fskit/project.yml.
        run: brew install autoconf automake libtool pkg-config xcodegen

      # ntfsprogs and ntfsprogs-plus are built from pinned sources and take
      # minutes. The key covers the build scripts and the shared env, so a
      # version bump or a flag change rebuilds and nothing else does.
      - name: Cache the NTFS toolchains
        uses: actions/cache@v4
        with:
          path: |
            tools/.local
            tools/.local-plus
          key: ntfstools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-ntfsprogs.sh', 'tools/build-ntfsprogs-plus.sh', 'tools/env.sh') }}

      - name: Run the checks
        run: tools/ci.sh

      # The fixture suite writes per-test logs; they are what makes a failure
      # diagnosable without reproducing it locally.
      - name: Test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            tools/build/test-logs
            tools/build/*.log
          if-no-files-found: ignore
          retention-days: 14

  # The ctest suite under AddressSanitizer (tools/ci.sh --asan, own
  # build-asan dir). Runs on macos-26, on purpose: on macOS 26 ASan
  # deadlocked inside __asan::AsanInitInternal() before main() (confirmed
  # 2026-09-14, every test; one runaway burned a core for 23 h), and the
  # user asked 2026-11-26 for the macOS hang to be fixed, not skipped --
  # so this job IS the re-test on the current runner image / Xcode. If it
  # goes green, the hang is gone on current Xcode and the stage can join
  # the default ci.sh sequence; if it hangs, the per-test ctest timeout
  # (60 s, stage_asan) bounds it and the log shows which tests stall.
  # Own concurrency group (ci-asan-<ref>): a push must never cancel this
  # job's run, and this job must never cancel a push run's checks job --
  # the two share nothing but the branch. Gated on the same budget guard.
  # The stage itself asserts the suite executed (ctest must report 100%
  # passed over >= 1 test) so a run that executes nothing fails loudly.
  asan:
    needs: budget-guard
    if: needs.budget-guard.outputs.allow == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: ci-asan-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Tools macOS does not ship
        # autotools: ntfsprogs-plus has no generated configure in its repo.
        run: brew install autoconf automake libtool pkg-config

      # Same toolchain cache as the checks job (same runner OS, so the
      # same cache entry). The ASan suite needs mkntfs/ntfsck from it;
      # tools/ci.sh --asan builds the toolchain first if the cache is cold.
      - name: Cache the NTFS toolchains
        uses: actions/cache@v4
        with:
          path: |
            tools/.local
            tools/.local-plus
          key: ntfstools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-ntfsprogs.sh', 'tools/build-ntfsprogs-plus.sh', 'tools/env.sh') }}

      - name: Run the ASan suite
        run: tools/ci.sh --asan

  # Experimental headless mount test. Manual trigger only (Actions >
  # CI > Run workflow), and allowed to fail: it cannot pass until the app
  # is signed with the managed com.apple.developer.fskit.fsmodule
  # entitlement (fskit/README.md, "Signing and enabling the extension").
  # Stock runners have no signing identity, fskitd refuses an unsigned
  # extension, and mount-test.sh then fails at step 1 (not registered).
  # The enable step itself is scriptable (fskit/scripts/enable-module.sh
  # edits the enabled-modules list directly — the System Settings toggle
  # is broken for third-party modules on macOS 26.3), so signing is the
  # only remaining gate. The day signing secrets exist, this job is the
  # whole test: build, install, enable, mount --rw, exercise, ntfsck.
  # Until then it documents each attempt in its logs.
  mount-test:
    needs: budget-guard
    runs-on: macos-26
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && needs.budget-guard.outputs.allow == 'true'
    continue-on-error: true
    # Own concurrency group, overriding the workflow-level ci-* group:
    # a dispatch used to share the checks job's group, so dispatching
    # while a push run was in flight cancelled that run's checks job
    # (run 45706260240, §4.2, cancelled by dispatch 45706341293 for the
    # previous head). A dispatch now only ever cancels an older dispatch.
    concurrency:
      group: ci-mount-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Tools macOS does not ship
        run: brew install autoconf automake libtool pkg-config xcodegen

      - name: Cache the NTFS toolchains
        uses: actions/cache@v4
        with:
          path: |
            tools/.local
            tools/.local-plus
          key: ntfstools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-ntfsprogs.sh', 'tools/build-ntfsprogs-plus.sh', 'tools/env.sh') }}

      - name: Build everything (tools/ci.sh)
        run: tools/ci.sh

      - name: Install the app and try to enable the extension
        run: |
          APP="/tmp/ttntfs-ci-dd/Build/Products/Debug/TT NTFS Native.app"
          [ -d "$APP" ] || { echo "app not built at $APP"; exit 1; }
          cp -R "$APP" /Applications/
          open -a "TT NTFS Native" || true
          sleep 5
          fskit/scripts/enable-module.sh || echo "enable-module.sh failed (expected without signing)"
          pluginkit -m -i ch.techtag.ntfs.extension -v || true

      - name: Mount test (read-write)
        run: fskit/scripts/mount-test.sh --rw

      - name: Mount test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mount-test-logs
          path: |
            tools/build/test-logs
            tools/build/*.log
          if-no-files-found: ignore
          retention-days: 14
